name: AhaMoment
options:
  bundleIdPrefix: com.shaorui0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"            # Swift 5 language mode: avoids Swift 6 strict-concurrency errors
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    exactVersion: 1.1.0     # released 2026-08-06 (v1.1.1 is only ~9 days old); experiment: on-device transcription bench
targets:
  AhaMoment:
    type: application
    platform: iOS
    sources:
      - AhaMoment
    dependencies:
      - package: WhisperKit
        product: WhisperKit
    info:
      path: AhaMoment/Info.plist
      properties:
        CFBundleDisplayName: Aha
        CFBundleURLTypes:   # aha://config?backup=...&token=... (setup QR from `aha qr`)
          - CFBundleURLName: com.shaorui0.ahamoment.config
            CFBundleURLSchemes: [aha]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: Aha Moment records audio to capture your spoken thoughts and send them to your own Mac.
        NSRemindersFullAccessUsageDescription: 把语音里识别出的待办写进提醒事项的『Aha 待确认』列表
        NSRemindersUsageDescription: 把语音里识别出的待办写进提醒事项的『Aha 待确认』列表
        NSLocalNetworkUsageDescription: Aha Moment uploads recordings to your own server on the local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shaorui0.ahamoment   # must be globally unique
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q42DQVJLCS     # Justin Shao (Personal Team), free provisioning
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
